<script>
const TZ_MAP = {
  ET: 'America/New_York',
  CT: 'America/Chicago',
  MT: 'America/Denver',
  PT: 'America/Los_Angeles',
  GMT: 'GMT'
};

function setTZ(label, btn) {
  const tz = TZ_MAP[label];
  document.querySelectorAll('.tz-btn').forEach(b => {
    b.classList.remove('btn-primary');
    b.classList.add('btn-outline-secondary');
  });
  btn.classList.remove('btn-outline-secondary');
  btn.classList.add('btn-primary');

  const fmt = (isoStr) => new Date(isoStr).toLocaleTimeString('en-US', {
    timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true
  });

  document.querySelectorAll('.time-cell').forEach(cell => {
    const approx = cell.dataset.approx;
    if (approx) {
      const announcedHM = fmt(cell.dataset.announced).replace(/ [AP]M$/, '');
      cell.innerHTML = `${announcedHM}/<strong>${fmt(approx)} ${label}</strong>`;
    } else {
      cell.innerHTML = `<strong>${fmt(cell.dataset.announced)} ${label}</strong>`;
    }
  });

  const url = new URL(window.location);
  url.searchParams.set('timezone', label);
  history.replaceState(null, '', url);
}

function filterTeam(team) {
  document.querySelectorAll('.game-row').forEach(row => {
    row.style.display =
      (team === 'all' || row.dataset.home === team || row.dataset.away === team)
      ? '' : 'none';
  });

  document.querySelectorAll('.day-section').forEach(section => {
    const visible = [...section.querySelectorAll('.game-row')].some(r => r.style.display !== 'none');
    section.style.display = visible ? '' : 'none';
  });

  // Quarto wraps markdown ## headings in <section class="level2">
  document.querySelectorAll('section.level2').forEach(section => {
    const visible = [...section.querySelectorAll('.day-section')].some(d => d.style.display !== 'none');
    section.style.display = visible ? '' : 'none';
  });

  const anyVisible = [...document.querySelectorAll('.game-row')].some(r => r.style.display !== 'none');
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const tzParam = params.get('timezone');
  if (tzParam && TZ_MAP[tzParam]) {
    const btn = document.querySelector(`.tz-btn[data-tz="${tzParam}"]`);
    if (btn) setTZ(tzParam, btn);
  }
});
</script>
