name: Update NWSL Schedule

on:
  schedule:
    - cron: '0 13 * * 1'  # Every Monday at 9 AM EDT (1 PM UTC)
  workflow_dispatch:      # Allow manual runs from the GitHub Actions UI

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.10.11"
          python-version: "3.13"
          enable-cache: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2


      - name: Fetch schedule and update QMDs
        run: uv run --frozen update_schedule.py

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Commit updated files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.qmd schedule.qmd _site
          git diff --staged --quiet || git commit -m "chore: auto-update NWSL schedule"
          git push
